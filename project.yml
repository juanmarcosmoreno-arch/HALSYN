# Proyecto Xcode de HÅLSYN, generado con XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Este archivo es la fuente de verdad: tras modificarlo, ejecuta `xcodegen generate`.
name: Halsyn

options:
  bundleIdPrefix: com.halsyn
  developmentLanguage: es
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

configFiles:
  Debug: Config/Halsyn.xcconfig
  Release: Config/Halsyn.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "39"
    # Equipo de firma y bundle ID: en Config/Local.xcconfig (ver Config/Halsyn.xcconfig).
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Los catálogos se generan con scripts/localization; que Xcode no los reescriba al compilar.
    SWIFT_EMIT_LOC_STRINGS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  HalsynKit:
    path: Packages/HalsynKit

targets:
  Halsyn:
    type: application
    platform: iOS
    sources:
      - path: Apps/HalsyniOS
        excludes:
          - "Resources/Info.plist"
      - path: Apps/Shared
    dependencies:
      - package: HalsynKit
        product: HalsynCore
      - package: HalsynKit
        product: HalsynDesign
      - package: HalsynKit
        product: HalsynHealthKit
      - target: HalsynWatch
      - target: HalsynWidgets
    info:
      path: Apps/HalsyniOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: HÅLSYN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, sv]
        LSRequiresIPhoneOS: true
        # El fondo coincide con el primer fotograma de la animación de apertura
        # (claro #F6F7F4, oscuro negro) para que no haya saltos.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Avisos de voz de la carrera del reloj por los auriculares del iPhone.
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: $(HALSYN_BUNDLE_ID)
            CFBundleURLSchemes: [halsyn]
        NSHealthShareUsageDescription: HÅLSYN lee tus datos de Apple Health (frecuencia cardíaca, HRV, sueño, actividad y entrenamientos) para mostrarte tu estado y tus tendencias. Los datos se procesan en tu dispositivo.
        NSHealthUpdateUsageDescription: HÅLSYN guarda en Apple Health los entrenamientos que registras con la app.
    settings:
      base:
        PRODUCT_NAME: Halsyn
        PRODUCT_BUNDLE_IDENTIFIER: $(HALSYN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Apps/HalsyniOS/Resources/Halsyn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HalsynWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/HalsynWatch
        excludes:
          - "Resources/Info.plist"
      - path: Apps/Shared
    dependencies:
      - package: HalsynKit
        product: HalsynCore
      - package: HalsynKit
        product: HalsynDesign
      - package: HalsynKit
        product: HalsynHealthKit
      - target: HalsynWatchWidgets
    info:
      path: Apps/HalsynWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: HÅLSYN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, sv]
        WKApplication: true
        CFBundleURLTypes:
          - CFBundleURLName: $(HALSYN_BUNDLE_ID).watchkitapp
            CFBundleURLSchemes: [halsyn]
        WKCompanionAppBundleIdentifier: $(HALSYN_BUNDLE_ID)
        # La app de reloj debe funcionar sin el iPhone (requisito de SPRING).
        WKRunsIndependentlyOfCompanionApp: true
        NSHealthShareUsageDescription: HÅLSYN lee tus datos de Apple Health para mostrar tu estado, tu recuperación y tus entrenamientos en el reloj.
        NSHealthUpdateUsageDescription: HÅLSYN guarda en Apple Health las carreras que registras en el reloj.
        NSLocationWhenInUseUsageDescription: HÅLSYN usa tu ubicación durante las carreras al aire libre para medir distancia, ritmo y ruta.
        # Mantiene la sesión de entrenamiento activa con la pantalla apagada.
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_NAME: HalsynWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(HALSYN_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Apps/HalsynWatch/Resources/HalsynWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Widgets del iPhone (pantalla de inicio y bloqueada). Leen el resumen que deja la app.
  HalsynWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/HalsynWidgets
        excludes:
          - "Info.plist"
      - path: Apps/WidgetsShared
    dependencies:
      - package: HalsynKit
        product: HalsynCore
      - package: HalsynKit
        product: HalsynDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Apps/HalsynWidgets/Info.plist
      properties:
        CFBundleDisplayName: HÅLSYN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, sv]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: HalsynWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(HALSYN_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Apps/HalsynWidgets/Resources/HalsynWidgets.entitlements

  # Complicaciones del Apple Watch.
  HalsynWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/HalsynWatchWidgets
        excludes:
          - "Info.plist"
      - path: Apps/WidgetsShared
    dependencies:
      - package: HalsynKit
        product: HalsynCore
      - package: HalsynKit
        product: HalsynDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Apps/HalsynWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: HÅLSYN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, sv]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: HalsynWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(HALSYN_BUNDLE_ID).watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Apps/HalsynWatchWidgets/Resources/HalsynWatchWidgets.entitlements

  HalsyniOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HalsyniOSTests
    dependencies:
      - target: Halsyn
      - package: HalsynKit
        product: HalsynCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HALSYN_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Halsyn.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Halsyn
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Halsyn:
    build:
      targets:
        Halsyn: all
        HalsynWatch: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HalsyniOSTests
        - package: HalsynKit/HalsynCoreTests
  HalsynWatch:
    build:
      targets:
        HalsynWatch: all
    run:
      config: Debug
