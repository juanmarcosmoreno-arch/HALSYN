name: CI

on:
  push:
  pull_request:

jobs:
  localization:
    name: Catálogos de idiomas sincronizados
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Las claves del código coinciden con Localization/source-keys.json
        run: python3 scripts/localization/extract_keys.py | diff - Localization/source-keys.json
      - name: Traducciones completas y catálogos regenerados
        run: |
          python3 scripts/localization/build_catalogs.py
          git diff --exit-code -- Apps/*/Resources/*.xcstrings

  core-linux:
    name: HalsynKit (Linux · swift test)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Tests del núcleo
        working-directory: Packages/HalsynKit
        run: swift test

  apple:
    name: iOS + watchOS (xcodebuild)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Xcode
        run: xcodebuild -version
      - name: HalsynKit en macOS (núcleo + design system)
        working-directory: Packages/HalsynKit
        run: swift build && swift test
      - name: Compilar app de Apple Watch (simulador)
        run: |
          xcodebuild build -project Halsyn.xcodeproj -scheme HalsynWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Compilar app de iPhone (incluye el reloj embebido) y ejecutar tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulador: $DEVICE_ID"
          export TEST_RUNNER_SNAPSHOT_DIR="$RUNNER_TEMP/capturas"
          xcodebuild test -project Halsyn.xcodeproj -scheme Halsyn \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Adjuntar capturas de las gráficas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-graficas
          path: ${{ runner.temp }}/capturas
          if-no-files-found: ignore
