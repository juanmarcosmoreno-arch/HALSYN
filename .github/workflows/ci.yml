name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: HalsynKit (Linux · swift test)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Tests del núcleo
        working-directory: Packages/HalsynKit
        run: swift test

  apple:
    name: iOS + watchOS (xcodebuild)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Xcode
        run: xcodebuild -version
      - name: HalsynKit en macOS (núcleo + design system)
        working-directory: Packages/HalsynKit
        run: swift build && swift test
      - name: Compilar app de Apple Watch (simulador)
        run: |
          xcodebuild build -project Halsyn.xcodeproj -scheme HalsynWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Compilar app de iPhone (incluye el reloj embebido) y ejecutar tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulador: $DEVICE_ID"
          xcodebuild test -project Halsyn.xcodeproj -scheme Halsyn \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO -quiet
